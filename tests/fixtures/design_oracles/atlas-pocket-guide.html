<!doctype html>
<!-- Authored oracle fixture, never a model-generated project or benchmark. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authored pocket-guide oracle fixture</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:16px;font:16px/1.5 system-ui;color:#161b22;background:#fff;max-width:44rem;--page:#fff}
button,input{font:inherit;color:inherit;background:inherit;border:1px solid #8c96a2;border-radius:3px;padding:8px;max-width:100%}
:focus-visible{outline:3px solid #3874e6;outline-offset:2px}
button[aria-pressed=true]{border-width:3px;font-weight:700}
input{display:block;width:100%}ul{padding:0;list-style:none}li{margin:8px 0}section{margin:20px 0}
.map{position:relative;border:1px solid #8c96a2;aspect-ratio:8/5}.map svg{display:block;width:100%;height:100%}
.pin{position:absolute;display:flex;gap:6px;align-items:center}.pin *{background:var(--page)}.pin button{min-width:2.5rem;border-radius:50%}
dialog{width:min(30rem,90vw);color:inherit;background:inherit}
@media(prefers-color-scheme:dark){body,dialog{color:#eaeef5;background:#181b22;--page:#181b22}}
</style>
<h1>AROUND HERE</h1><p>A pocket guide to small places</p>
<p>Local demo with Sample data. The map is a schematic drawing, not to scale: no geolocation and no real navigation.</p>
<label for="query">Search places</label><input id="query" type="search" oninput="render()">
<p><button id="show-All" onclick="setCategory('All')">All</button> <button id="show-Indoors" onclick="setCategory('Indoors')">Indoors</button>
  <button id="show-Outdoors" onclick="setCategory('Outdoors')">Outdoors</button> <button onclick="clearFilters()">Clear filters</button></p>
<section aria-labelledby="map-title"><h2 id="map-title">Schematic map</h2>
  <div class="map"><svg viewBox="0 0 320 200" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" opacity=".4">
    <path d="M0 160C90 120 150 200 320 150"/><path d="M40 0L130 110L320 80" stroke-dasharray="6 6"/><rect x="14" y="10" width="92" height="52"/></svg>
    <div id="pins"></div></div>
</section>
<section aria-labelledby="list-title"><h2 id="list-title">Places</h2><ul id="places"></ul><p id="no-places" role="status" hidden>No places found</p></section>
<section aria-labelledby="details-title"><h2 id="details-title">Details</h2><div id="details"></div>
  <button id="notes-button" onclick="showNotes(this)">Place notes</button></section>
<dialog aria-labelledby="notes-title"><h2 id="notes-title">Place notes</h2><p id="notes-name"></p><p id="notes-text"></p>
  <button onclick="this.closest('dialog').close()">Close</button></dialog>
<script>
window.fault='';
const places=[['North garden','Outdoors','A fenced herb garden with two benches.',6,8],
  ['Paper house','Indoors','A small room of folded-paper models.',34,42],
  ['River steps','Outdoors','Worn stone steps down to the water.',50,74]]
  .map(([title,category,note,left,top])=>({title,category,note,left,top}));
let selected=null,previous=null,category='All',cleared=false;
const el=id=>document.getElementById(id);
const make=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node;};
const views=places.map((place,index)=>{
  const pin=make('span',''),mark=make('button',index+1),row=make('li',''),entry=make('button',place.title);
  pin.className='pin';pin.style.left=place.left+'%';pin.style.top=place.top+'%';
  mark.setAttribute('aria-label',`Select ${index+1}: ${place.title}`);
  mark.onclick=()=>choosePlace(window.fault==='map-off-by-one'?(index+1)%places.length:index);
  entry.onclick=()=>choosePlace(index);
  pin.append(mark,make('span',place.title));row.append(entry,make('span',` ${index+1} · ${place.category}`));
  el('pins').append(pin);el('places').append(row);
  return {pin,mark,row,entry};
});
function render(){
  const query=el('query').value.trim().toLowerCase();
  const visible=places.map(place=>place.title.toLowerCase().includes(query)
    &&(category==='All'||place.category===category||window.fault==='search-replaces-category'&&query!==''));
  if(selected!==null&&!visible[selected]&&window.fault!=='stale-details'){selected=null;cleared=true;}
  for(const name of ['All','Indoors','Outdoors'])el('show-'+name).setAttribute('aria-pressed',String(category===name));
  views.forEach((view,index)=>{
    view.row.hidden=!visible[index];view.pin.hidden=!visible[index]&&window.fault!=='map-not-filtered';
    view.entry.setAttribute('aria-pressed',String(selected===index));view.mark.setAttribute('aria-pressed',String(selected===index));
  });
  el('no-places').hidden=visible.includes(true);
  if(selected===null)el('details').replaceChildren(make('p',cleared?'Selection cleared: that place is hidden by the current filters.'
    :'No place selected. Choose a place from the list or the map.'));
  else el('details').replaceChildren(make('h3',places[selected].title),make('p',places[selected].category+' · '+places[selected].note));
  el('notes-button').disabled=selected===null;
}
function choosePlace(index){previous=selected;selected=index;cleared=false;render();}
function setCategory(value){category=value;render();}
function clearFilters(){el('query').value='';if(window.fault!=='clear-keeps-category')category='All';render();}
function showNotes(button){
  button.focus();const place=places[window.fault==='notes-previous-place'?previous:selected];
  el('notes-name').textContent=place?place.title:'No place selected';el('notes-text').textContent=place?place.note:'';
  document.querySelector('dialog').showModal();
}
render();
</script></html>
