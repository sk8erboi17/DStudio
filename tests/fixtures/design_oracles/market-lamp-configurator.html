<!doctype html>
<!-- Authored oracle fixture, never a model-generated project or benchmark. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authored lamp-configurator oracle fixture</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:16px;font:16px/1.5 system-ui;color:#161b22;background:#fff}
button,input{font:inherit;color:inherit;max-width:100%}
button,input[type=number]{background:inherit;border:1px solid #8c96a2;padding:6px}fieldset{margin:0;padding:8px;border:1px solid #8c96a2}
:focus-visible{outline:3px solid #3874e6;outline-offset:2px}p{margin:6px 0}ul{list-style:none;margin:0;padding:0}
.fields{display:grid;gap:8px;max-width:20rem}.fields label{display:grid}.fields .check{display:flex;gap:8px;align-items:center}
.check input{flex:none;width:20px;height:20px;margin:0}.lamp{display:block;width:96px;height:96px;fill:none;stroke:currentColor;stroke-width:4}
.sum{font-size:1.5rem;font-weight:700}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#rows li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid #8c96a2}
dialog{width:min(32rem,92vw);color:inherit;background:inherit}
@media(prefers-color-scheme:dark){body,dialog{color:#eaeef5;background:#181b22}}
</style>
<h1>SOFT LIGHT</h1><p>Make a desk lamp yours</p><p>Sample data: a fictional lamp and a local demo basket.</p>
<section aria-labelledby="configuration-title"><h2 id="configuration-title">Configuration</h2>
  <svg class="lamp" viewBox="0 0 96 96" aria-hidden="true"><path d="M30 88h36M48 88V44M28 44h40L58 12H38z"/></svg>
  <div class="fields">
    <fieldset><legend>Colour</legend>
      <label class="check"><input type="radio" name="colour" value="Chalk" checked onchange="render()"><span>Chalk (€60)</span></label>
      <label class="check"><input type="radio" name="colour" value="Ink" onchange="render()"><span>Ink (€65)</span></label></fieldset>
    <label class="check"><input type="checkbox" id="cable" onchange="render()"><span>Long cable (+€8)</span></label>
    <label for="quantity">Quantity</label><input type="number" id="quantity" min="1" max="4" step="1" value="1" oninput="render()">
  </div>
  <p id="hint" hidden>Choose a whole quantity from 1 to 4.</p>
  <p>Unit price <strong id="unit"></strong></p><p class="sum">Total <span id="total"></span></p>
  <button id="add" onclick="add()">Add to basket</button><p id="notice" role="status"></p></section>
<section aria-labelledby="basket-title"><h2 id="basket-title">Basket</h2><ul id="rows"></ul><p id="empty">Your basket is empty.</p>
  <p class="sum">Grand total <span id="grand"></span></p>
  <div class="bar"><button onclick="clearBasket()">Clear basket</button><button onclick="review(this)">Review order</button></div></section>
<dialog aria-labelledby="review-title"><h2 id="review-title">Order review</h2><ul id="lines"></ul><p id="review-total"></p>
  <p id="placed" role="status"></p><div class="bar"><button onclick="confirmOrder()">Confirm demo order</button>
  <button onclick="this.closest('dialog').close()">Close</button></div></dialog>
<script>
window.fault='';
const prices={Chalk:60,Ink:65};
// One basket row per colour/cable pair; a row never holds more than 4.
let basket=[],notice='',grand=0;
const el=id=>document.getElementById(id),colourNow=()=>document.querySelector('[name=colour]:checked').value;
const unitOf=(colour,cable)=>prices[colour]+(cable&&window.fault!=='cable-not-priced'?8:0);
const label=row=>`${row.colour}, ${row.cable?'Long cable':'standard cable'}`,subtotal=row=>row.quantity*unitOf(row.colour,row.cable);
const sum=()=>basket.reduce((total,row)=>total+subtotal(row),0);
function quantity(){const value=Number(el('quantity').value);return Number.isInteger(value)&&value>=1&&value<=4?value:null;}
// Rows are rebuilt, so keyboard focus returns to the same control (button n) of the row acted on.
// keepTotal exists only for the stale-grand-total fault.
function render(at,n,keepTotal){
  const count=quantity(),unit=unitOf(colourNow(),el('cable').checked);
  el('unit').textContent='€'+unit;el('total').textContent=count===null?'not available':'€'+unit*(window.fault==='total-ignores-quantity'?1:count);
  el('add').disabled=count===null;el('hint').hidden=count!==null;el('notice').textContent=notice;
  el('rows').innerHTML=basket.map((row,i)=>`<li><div><strong>${label(row)}</strong><br>${row.quantity} × €${unitOf(row.colour,row.cable)} = €${subtotal(row)}</div>
    <div class="bar"><button onclick="change(${i},-1)" aria-label="Decrease quantity"${row.quantity>1?'':' disabled'}>−</button>
    <button onclick="change(${i},1)" aria-label="Increase quantity"${row.quantity<4?'':' disabled'}>+</button>
    <button onclick="removeRow(${i})">Remove</button></div></li>`).join('');
  el('empty').hidden=basket.length>0||window.fault==='missing-empty-state';
  if(!keepTotal)grand=sum();el('grand').textContent='€'+grand;
  const row=el('rows').children[at]||el('rows').lastElementChild,button=row?.querySelectorAll('button')[n];
  if(at!==undefined)(button&&!button.disabled?button:row?.querySelector('button:enabled'))?.focus();
}
function add(){
  const colour=colourNow(),cable=el('cable').checked,count=quantity();if(count===null)return;
  const same=row=>row.colour===colour&&row.cable===cable,held=basket.filter(same).reduce((total,row)=>total+row.quantity,0);
  const added=window.fault==='cap-not-enforced'?count:Math.min(count,4-held);
  let row=window.fault==='no-merge'?null:basket.find(same);
  if(added>0){if(!row)basket.push(row={colour,cable,quantity:0});row.quantity+=added;}
  const name=label({colour,cable});
  notice=added===count?`${added} × ${name} added.`:window.fault==='cap-silent'?'':`Limit reached: a basket row holds at most 4 of the same lamp, so ${added} of ${count} were added.`;
  render();
}
function change(at,step){
  basket[at].quantity=Math.min(4,Math.max(1,basket[at].quantity+step));notice='';render(at,step<0?0:1,window.fault==='stale-grand-total');
}
function removeRow(at){basket.splice(window.fault==='remove-wrong-row'?basket.length-1:at,1);notice='';render(at,2);}
function clearBasket(){basket=[];notice='';render();}
function review(button){
  button.focus();el('placed').textContent='';el('review-total').textContent='Grand total €'+sum();
  el('lines').innerHTML=basket.map(row=>`<li>${label(row)}: ${row.quantity} × €${unitOf(row.colour,row.cable)} = €${subtotal(row)}</li>`).join('')||'<li>Your basket is empty.</li>';
  document.querySelector('dialog').showModal();
}
function confirmOrder(){el('placed').textContent=window.fault==='false-order-claim'?'Order placed. Thank you!':'No order was placed. This is a local demo.';}
render();
</script></html>
