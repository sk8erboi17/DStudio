<!doctype html>
<!-- Authored oracle fixture, never a model-generated project or benchmark. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authored camera-compare oracle fixture</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:16px;font:16px/1.5 system-ui;color:#161b22;background:#fff}
button,select,input{font:inherit;color:inherit;max-width:100%}
button,select,input[type=search]{background:inherit;border:1px solid #8c96a2;padding:6px}
:focus-visible{outline:3px solid #3874e6;outline-offset:2px}h3,p{margin:4px 0}button[aria-pressed=true]{border-width:3px;font-weight:700}
.controls{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}.controls label{display:grid;min-width:0}.controls input,.controls select{width:100%}
#shelf{list-style:none;margin:8px 0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
#shelf li{border-top:3px solid;padding-top:8px}#shelf svg{display:block;width:72px;height:48px;fill:none;stroke:currentColor;stroke-width:3}
.price{font-size:1.5rem;font-weight:700}.pick{display:flex;gap:8px;align-items:center}.pick input{flex:none;width:20px;height:20px;margin:0}
table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.caps #compared td{text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#chosen{margin:4px 0;padding-left:1.25rem}
dialog{width:min(34rem,92vw);color:inherit;background:inherit}
@media(prefers-color-scheme:dark){body,dialog{color:#eaeef5;background:#181b22}}
</style>
<h1>FIELD SHOP</h1><p>Find a camera companion</p><p>Sample data: an illustrative catalogue. No purchases can be made here.</p>
<div class="controls">
  <label>Search<input type="search" id="q" oninput="render()"></label>
  <label>Size<select id="size" onchange="render()"><option>All</option><option>Small</option><option>Large</option></select></label>
  <label>Sort by price<select id="sort" onchange="render()"><option>Low to high</option><option>High to low</option></select></label>
</div>
<section aria-labelledby="shelf-title"><h2 id="shelf-title">Shelf</h2><p id="shown" role="status"></p><ul id="shelf"></ul></section>
<section aria-labelledby="compare-title"><h2 id="compare-title">Comparison</h2><p id="count"></p>
  <p id="hint" hidden>Compare up to two products at a time.</p><ul id="chosen" hidden></ul><p id="notice" role="status"></p>
  <button id="open" onclick="openCompare(this)">Compare selected</button></section>
<dialog aria-labelledby="dialog-title"><h2 id="dialog-title">Side by side</h2><div id="compared"></div>
  <button id="close" onclick="this.closest('dialog').close()">Close</button></dialog>
<script>
// window.fault switches on one deliberate defect; window.variant switches to another correct rendering:
//   article-dialog          the dialog compares one article per product instead of the columns of a table
//   header-remove-buttons   each column header of the table holds the product name and its Remove control
//   other-wording           the dialog button carries the number of selected products, and the refusal
//                           says "You can compare two products at a time"
//   button-toggles          the Compare toggles are pressed-state buttons; with two selected the others are
//                           disabled and a hint that is always shown states the limit
//   selected-list           the Comparison panel also lists the selected names, so a name is rendered twice
//   worded-toggle-labels    the Compare toggles are labelled "Add to comparison"
//   named-toggle-labels     each Compare label ends with the product name in a visually hidden element
//   uppercase-values        the values of the comparison table are set in capitals by the style sheet
window.fault='';window.variant='';
const products=[
  ['Pocket strap',18,'Small','<path d="M6 24c14-22 46-22 60 0"/><circle cx="6" cy="24" r="4"/><circle cx="66" cy="24" r="4"/>'],
  ['Canvas wrap',32,'Large','<rect x="6" y="8" width="60" height="32" rx="4"/><path d="M6 20h60M36 8v32"/>'],
  ['Lens pouch',24,'Small','<path d="M16 14h40l6 28H10z"/><path d="M20 14c4-10 28-10 32 0"/>']];
let picked=[],notice='',lastSize='All';
const el=id=>document.getElementById(id),fault=name=>window.fault===name,variant=name=>window.variant===name;
function render(){
  const query=el('q').value.trim().toLowerCase(),size=el('size').value;
  if(fault('filter-drops-selection')&&size!==lastSize)picked=picked.filter(i=>size==='All'||products[i][2]===size);
  lastSize=size;
  const descending=el('sort').value==='High to low'&&!fault('sort-direction-ignored');
  const shown=products.map((product,i)=>({product,i}))
    .filter(({product})=>product[0].toLowerCase().includes(query)&&!(fault('search-hides-everything')&&query)
      &&(size==='All'||product[2]===size||fault('filters-not-combined')&&query||fault('large-filter-ignored')&&size==='Large'))
    .sort((a,b)=>(a.product[1]-b.product[1])*(descending?-1:1));
  el('shelf').innerHTML=shown.map(({product,i})=>`<li><svg viewBox="0 0 72 48" aria-hidden="true">${product[3]}</svg><h3>${product[0]}</h3>
    <p class="price">€${product[1]}</p><p>Size: ${product[2]}</p>
    ${variant('button-toggles')?`<button data-i="${i}" onclick="toggle(${i},this)" aria-label="Compare ${product[0]}">Compare</button>`
      :`<label class="pick"><input type="checkbox" data-i="${i}" onchange="toggle(${i},this)"><span>${variant('worded-toggle-labels')?'Add to comparison':'Compare'}${
        variant('named-toggle-labels')?`<span class="sr"> ${product[0]}</span>`:''}</span></label>`}</li>`).join('');
  el('shown').textContent=shown.length?`Showing ${shown.length} of 3 products`:'No products match this search and size.';
  sync();
}
// Selection changes update the existing toggles in place, so keyboard focus stays on the toggle.
// `stale` exists only for the faults that leave the toggles or the count behind.
function sync(stale){
  for(const control of document.querySelectorAll('#shelf [data-i]')){
    const on=picked.includes(+control.dataset.i);
    if(!control.matches('input')){control.setAttribute('aria-pressed',String(on));control.disabled=!on&&picked.length>=2;}
    else if(stale!=='toggles')control.checked=on;
  }
  if(stale!=='count')el('count').textContent=`${picked.length} of 2 selected for comparison`;
  el('notice').textContent=notice;el('hint').hidden=!variant('button-toggles');
  el('chosen').hidden=!variant('selected-list');el('chosen').innerHTML=picked.map(i=>`<li><span>${products[i][0]}</span></li>`).join('');
  el('open').textContent=variant('other-wording')?`Compare selected (${picked.length})`:'Compare selected';
}
function toggle(i,control){
  notice='';
  const on=control.matches('input')?control.checked:!picked.includes(i);
  if(!on)picked=picked.filter(j=>j!==i);
  else if(picked.length<2||fault('third-accepted'))picked.push(i);
  else if(fault('third-evicts-oldest'))picked=[picked[1],i];
  else{
    if(!fault('third-refused-silently'))notice=variant('other-wording')?`You can compare two products at a time, so ${products[i][0]} was not added.`
      :`Only two products can be compared. ${products[i][0]} was not added; remove one first.`;
    if(fault('third-toggle-stays-checked'))return sync('toggles');
  }
  sync();
}
function drawCompare(list){
  const columns=list.map(i=>products[i]),shared=fault('shared-compare-values')||fault('article-shared-values');
  const value=(column,k)=>(shared?columns[0]:column)[k];
  const remove=i=>`<button onclick="unpick(${i})" aria-label="Remove ${products[i][0]}">Remove</button>`;
  if(!columns.length)el('compared').innerHTML='<p>Nothing is selected for comparison.</p>';
  else if(variant('article-dialog')||fault('article-shared-values'))
    el('compared').innerHTML=`<div class="pair">${list.map((i,n)=>`<article><h3>${columns[n][0]}</h3><p>€${value(columns[n],1)}</p>
      <p>Size: ${value(columns[n],2)}</p>${remove(i)}</article>`).join('')}</div>`;
  else{
    const inHead=variant('header-remove-buttons');
    el('compared').innerHTML=`<table><thead><tr><th scope="col">Detail</th>${list.map((i,n)=>
      `<th scope="col">${columns[n][0]}${inHead?' '+remove(i):''}</th>`).join('')}</tr></thead>
    <tbody><tr><th scope="row">Price</th>${columns.map(c=>`<td>€${value(c,1)}</td>`).join('')}</tr>
    <tr><th scope="row">Size</th>${columns.map(c=>`<td>${value(c,2)}</td>`).join('')}</tr>
    ${inHead?'':`<tr><th scope="row">Selection</th>${list.map(i=>`<td>${remove(i)}</td>`).join('')}</tr>`}
    </tbody></table>`;
  }
}
function openCompare(button){document.body.classList.toggle('caps',variant('uppercase-values'));button.focus();drawCompare(picked);document.querySelector('dialog').showModal();}
function unpick(i){
  const rest=picked.filter(j=>j!==i);
  if(!fault('dialog-remove-not-synced')){
    picked=rest;notice='';sync(fault('dialog-remove-stale-toggle')?'toggles':fault('dialog-remove-stale-count')?'count':'');
  }
  drawCompare(rest);el('close').focus();
}
render();
</script></html>
