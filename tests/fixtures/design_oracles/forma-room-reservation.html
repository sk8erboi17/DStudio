<!doctype html>
<!-- Authored oracle fixture, never a model-generated project or benchmark. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authored room-wizard oracle fixture</title>
<style>
*{box-sizing:border-box}body{margin:16px;font:16px/1.5 system-ui;color:#161b22;background:#fff}
button,input[type=text]{font:inherit;color:inherit;background:inherit;border:1px solid #8c96a2;padding:8px;max-width:100%}
input[type=text]{display:block;width:8em}button:disabled{opacity:.55}
:focus-visible{outline:3px solid #3874e6;outline-offset:2px}
section{max-width:34rem;border:1px solid #8c96a2;padding:12px}
ol{display:flex;flex-wrap:wrap;gap:4px 36px;margin:0;padding-left:24px}[aria-current]{font-weight:700;text-decoration:underline}
fieldset{min-width:0;margin:0 0 12px;padding:4px 12px;border:1px solid #8c96a2}
.choice{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:10px 0}
.choice input{width:1.2em;height:1.2em;margin:.15em 0 0;color:inherit;background:transparent}
dt{font-weight:700}dd{margin:0 0 8px}
@media(prefers-color-scheme:dark){body{color:#eaeef5;background:#181b22}}
</style>
<p>ROOMDAY</p><h1>Plan a room session</h1><p>Sample data. This local demo never books a room.</p>
<section aria-labelledby="step-title">
<ol id="steps" aria-label="Steps"><li>Room</li><li>Time</li><li>Review</li></ol>
<h2 id="step-title" tabindex="-1"></h2>
<fieldset id="room-step"><legend>Choose a room</legend>
<label class="choice"><input type="radio" name="room" value="Cedar" onchange="pick(this)"><span>Cedar (4 people)</span></label>
<label class="choice"><input type="radio" name="room" value="Birch" onchange="pick(this)"><span>Birch (8 people)</span></label></fieldset>
<div id="time-step">
<fieldset><legend>Start time</legend>
<label class="choice"><input type="radio" name="time" value="09:00" onchange="pick(this)"><span>09:00</span></label>
<label class="choice"><input type="radio" name="time" value="14:00" onchange="pick(this)"><span>14:00</span></label></fieldset>
<p><label for="count">Participants</label><input type="text" inputmode="numeric" id="count" aria-describedby="count-help count-error" oninput="typed()"></p>
<p id="count-help"></p><p id="count-error" role="alert" hidden></p></div>
<dl id="review-step"></dl>
<p id="done-step">No room was booked. This was a local demo with sample data.</p>
<p><button id="back" onclick="go(-1)">Back</button> <button id="next" onclick="go(1)">Continue</button>
<button id="confirm" onclick="go(1)">Confirm</button> <button id="restart" onclick="restart()">Start over</button></p>
</section>
<script>
window.fault='';
const rooms={Cedar:4,Birch:8},titles=['Room','Time','Review','Demo complete'];
let state={step:0,room:'',time:'',count:''},capacity=0;
const el=id=>document.getElementById(id);
function countValid(){
  const count=Number(state.count);
  return (window.fault==='fraction-accepted'?state.count.trim()!=='':/^\d+$/.test(state.count))&&count>=1&&count<=capacity;
}
function render(){
  const step=state.step;
  document.querySelectorAll('#steps li').forEach((item,i)=>i===step?item.setAttribute('aria-current','step'):item.removeAttribute('aria-current'));
  el('step-title').textContent=titles[step];
  ['room-step','time-step','review-step','done-step'].forEach((id,i)=>el(id).hidden=i!==step);
  for(const input of document.querySelectorAll('input[type=radio]'))input.checked=input.value===state[input.name];
  if(el('count').value!==state.count)el('count').value=state.count;
  const bad=state.count!==''&&!countValid();
  el('count-help').textContent=`Whole number from 1 to ${capacity} for ${state.room}.`;
  el('count').setAttribute('aria-invalid',String(bad));el('count-error').hidden=!bad;
  el('count-error').textContent=bad?`${state.count} is not a whole number from 1 to ${capacity}.`:'';
  el('next').hidden=step>1;el('next').disabled=step===0?!state.room:!(state.time&&countValid());
  el('back').hidden=step===0||step===3;el('confirm').hidden=step!==2;el('restart').hidden=step!==3;
  if(step===2&&!(window.fault==='review-not-refreshed'&&el('review-step').children.length)){
    el('review-step').replaceChildren(...[['dt','Room'],['dd',state.room],['dt','Time'],['dd',state.time],['dt','Participants'],['dd',state.count]]
      .map(([tag,value])=>Object.assign(document.createElement(tag),{textContent:value})));
  }
}
function pick(input){
  state[input.name]=input.value;
  if(input.name==='room'){
    if(!(window.fault==='stale-capacity'&&capacity))capacity=rooms[state.room];
    if(window.fault==='count-clamped-on-room-change'&&Number(state.count)>capacity)state.count=String(capacity);
  }
  render();
}
function typed(){state.count=el('count').value;render();}
function go(change){
  if(change<0&&state.step===1){
    if(window.fault==='back-clears-count')state.count='';
    if(window.fault==='back-loses-time')state.time='';
  }
  state.step+=change;render();el('step-title').focus();
}
function restart(){
  state=window.fault==='start-over-keeps-choices'?{...state,step:0}:{step:0,room:'',time:'',count:''};
  if(!state.room)capacity=0;
  render();el('step-title').focus();
}
render();
</script></html>
