<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DStudio</title>
  <script>
    (() => {
      try {
        const prefix = '#port-migrate=';
        if (location.hash.startsWith(prefix)) {
          let encoded = location.hash.slice(prefix.length).replace(/-/g, '+').replace(/_/g, '/');
          while (encoded.length % 4) encoded += '=';
          const binary = atob(encoded);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const values = JSON.parse(new TextDecoder().decode(bytes));
          for (const [key, value] of Object.entries(values || {})) {
            if (typeof value === 'string') localStorage.setItem(key, value);
          }
          history.replaceState(null, '', location.pathname);
        }
        const settings = JSON.parse(localStorage.getItem('ds4web.settings.v2') || '{}');
        const requestedTheme = settings?.theme || 'light';
        const resolvedTheme = requestedTheme === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (requestedTheme === 'dark' ? 'dark' : 'light');
        document.documentElement.dataset.theme = resolvedTheme;
        if (settings && settings.lanClientHost) location.replace('/');
        if (!settings || settings.onboarded !== true) location.replace('/');
      } catch {
        location.replace('/');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --accent: #7aa7ff;
      --accent-strong: #568fe8;
      --text: #202124;
      --muted: #73777f;
      --faint: #a5a8ae;
      --line: rgba(32, 33, 36, 0.09);
      --track: rgba(32, 33, 36, 0.10);
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #070707;
        --surface: #101114;
        --text: #f2f4f8;
        --muted: #8f949d;
        --faint: #5f646d;
        --line: rgba(255, 255, 255, 0.09);
        --track: rgba(255, 255, 255, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(392px, calc(100vw - 48px));
    }
    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 154px;
      height: 154px;
      margin-bottom: 23px;
    }
    .logo-wrap::before {
      position: absolute;
      inset: 1px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(86, 143, 232, .18), rgba(86, 143, 232, 0) 67%);
      content: '';
      animation: breathe 2.8s ease-in-out infinite;
    }
    .logo {
      width: 116px;
      height: 116px;
      position: relative;
      filter: drop-shadow(0 12px 28px rgba(86, 143, 232, 0.16));
    }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .72; } }
    .loading-main { width: 100%; }
    .progress-meta {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 11px;
      font-size: 13px;
      line-height: 1.35;
    }
    .progress {
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }
    .progress__bar {
      width: 4%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-strong), #8ab3ff);
      box-shadow: 0 0 16px rgba(122, 167, 255, 0.42);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }
    .stage {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-weight: 560;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pct {
      flex: 0 0 auto;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .detail {
      width: 100%;
      min-height: 18px;
      margin: 9px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .boot-steps {
      display: grid;
      gap: 0;
      width: 100%;
      margin-top: 25px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }
    .boot-step {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      min-height: 31px;
      color: var(--faint);
      opacity: .34;
      transition: color .25s, opacity .25s;
    }
    .boot-step.active { color: var(--text); opacity: 1; }
    .boot-step.done { color: var(--muted); opacity: .68; }
    .boot-step__mark {
      color: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      text-align: center;
    }
    .boot-step.active .boot-step__mark { color: var(--accent-strong); }
    .boot-step__label { font-size: 12px; }
    .boot-step__detail {
      max-width: 172px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .boot-foot {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      margin-top: 20px;
      color: var(--faint);
      font-size: 10.5px;
    }
    .boot-foot a { color: inherit; text-decoration: none; }
    .boot-foot a:hover { color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      .progress__bar { transition: none; }
      .logo-wrap::before { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="DStudio is starting">
    <div class="logo-wrap">
      <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="DStudio">
        <defs>
          <linearGradient id="logo-gradient" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a9caff"/>
            <stop offset="1" stop-color="#568fe8"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#logo-gradient)" stroke-width="10.5" stroke-linecap="round">
          <path d="M30 24C41 15 59 15 70 24"/>
          <path d="M76 30C85 41 85 59 76 70"/>
          <path d="M70 76C59 85 41 85 30 76"/>
          <path d="M24 70C15 59 15 41 24 30"/>
        </g>
        <circle cx="50" cy="50" r="8" fill="url(#logo-gradient)"/>
      </svg>
    </div>
    <div class="loading-main">
      <div class="progress-meta">
        <span class="stage" id="loading-stage">Starting DStudio…</span>
        <span class="pct" id="loading-pct">4%</span>
      </div>
      <div class="progress" id="loading-progress" role="progressbar" aria-label="DStudio loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
        <div class="progress__bar" id="loading-bar"></div>
      </div>
      <p class="detail" id="loading-detail" aria-live="polite">Connecting to the local launcher</p>
    </div>
    <div class="boot-steps" id="boot-steps" aria-label="Startup stages">
      <div class="boot-step active" data-at="12"><span class="boot-step__mark">●</span><span class="boot-step__label">Launcher</span><span class="boot-step__detail">connecting</span></div>
      <div class="boot-step" data-at="34"><span class="boot-step__mark">·</span><span class="boot-step__label">Engine settings</span><span class="boot-step__detail">—</span></div>
      <div class="boot-step" data-at="82"><span class="boot-step__mark">·</span><span class="boot-step__label">Model runtime</span><span class="boot-step__detail">—</span></div>
      <div class="boot-step" data-at="100"><span class="boot-step__mark">·</span><span class="boot-step__label">Workspace</span><span class="boot-step__detail">—</span></div>
    </div>
    <div class="boot-foot"><span>Everything runs on this Mac.</span><a href="/" aria-label="Open engine settings">Engine settings</a></div>
  </main>
  <script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const progress = document.querySelector('#loading-progress');
    const bar = document.querySelector('#loading-bar');
    const stage = document.querySelector('#loading-stage');
    const pct = document.querySelector('#loading-pct');
    const detail = document.querySelector('#loading-detail');
    const bootSteps = [...document.querySelectorAll('.boot-step')];
    let visualPct = 4;

    function syncBootSteps(message = '') {
      let currentFound = false;
      bootSteps.forEach((row) => {
        const threshold = Number(row.dataset.at) || 100;
        const done = visualPct >= threshold;
        const active = !done && !currentFound;
        if (active) currentFound = true;
        row.classList.toggle('done', done);
        row.classList.toggle('active', active);
        const mark = row.querySelector('.boot-step__mark');
        const status = row.querySelector('.boot-step__detail');
        if (mark) mark.textContent = done ? '✓' : active ? '●' : '·';
        if (status) status.textContent = done ? 'ready' : active ? (message || 'running') : '—';
      });
    }

    function showProgress(value, label, message = '') {
      const numeric = Number.isFinite(Number(value)) ? Number(value) : visualPct;
      visualPct = Math.max(visualPct, Math.min(100, Math.max(0, Math.round(numeric))));
      bar.style.width = `${visualPct}%`;
      progress.setAttribute('aria-valuenow', String(visualPct));
      pct.textContent = `${visualPct}%`;
      if (label) stage.textContent = label;
      detail.textContent = message || '';
      syncBootSteps(message);
    }

    syncBootSteps('connecting');

    async function fetchJson(url, opts = {}, timeout = 4000) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), timeout);
      try {
        const res = await fetch(url, { ...opts, signal: ctl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function startWithSavedSettings() {
      let st;
      try {
        st = await fetchJson('/api/status', {}, 3500);
      } catch {
        return true; // waitForReady handles a launcher that is still connecting
      }
      if (st.running) return true;
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('ds4web.settings.v2') || '{}') || {}; }
      catch { saved = {}; }
      const gguf = typeof saved.modelGguf === 'string' ? saved.modelGguf : '';
      let engineDir = typeof saved.modelEngineDir === 'string' ? saved.modelEngineDir : '';
      /* Upgrade missing checkout metadata and repair stale absolute paths after
       * a source tree or app bundle has moved. The GGUF catalog is authoritative. */
      if (gguf) {
        try {
          const catalog = await fetchJson('/api/ggufs', {}, 5000);
          const matches = (catalog.ggufs || []).filter((g) => g.path === gguf);
          if (matches.length === 1 && matches[0].engineDir && matches[0].engineDir !== engineDir) {
            engineDir = matches[0].engineDir;
            saved.modelEngineDir = engineDir;
            localStorage.setItem('ds4web.settings.v2', JSON.stringify(saved));
          }
        } catch { /* /api/start below will expose a precise model error */ }
      }
      /* Recover a previously selected checkout before deciding setup is
       * required. This also repairs old installs whose managed ds4 symlink
       * points at a repository that has since moved. The checkout endpoint now
       * persists the repaired path for every later native-app launch. */
      if (!st.ds4dirOk && engineDir) {
        try {
          await fetchJson('/api/engine/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'ds4web' },
            body: JSON.stringify({ dir: engineDir }),
          }, 10000);
          st = await fetchJson('/api/status', {}, 3500);
        } catch { /* the main UI will offer install, path and LAN recovery */ }
      }
      const models = st.models || {};
      const variants = st.variants || {};
      if (!st.ds4dirOk || !(models.standard || models.uncensored || variants.flash || variants.pro || st.modelFile)) {
        showProgress(visualPct, 'Setup required', 'Opening DStudio');
        await sleep(250);
        location.replace('/');
        return false;
      }

      const ctx = Math.max(1024, Math.min(1048576, parseInt(saved.ctxSize, 10) || 65536));
      const power = Math.max(1, Math.min(100, parseInt(saved.enginePower, 10) || 90));
      const ssdStreaming = ['off', 'on', 'auto'].includes(saved.ssdStreaming) ? saved.ssdStreaming : 'off';
      const metalHotlistSeed = !!saved.metalHotlistSeed;
      const dspark = !!saved.dspark;
      const variant = saved.modelVariant === 'pro' ? 'pro' : 'flash';
      showProgress(5, 'Applying saved engine settings…',
        `${Math.round(ctx / 1024)}k context · SSD streaming ${ssdStreaming}`);
      try {
        if (engineDir && engineDir !== st.ds4dir) {
          await fetchJson('/api/engine/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'ds4web' },
            body: JSON.stringify({ dir: engineDir }),
          }, 10000);
        }
        const started = await fetchJson('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'ds4web' },
          body: JSON.stringify({
            mode: 'server',
            force: true,
            model: 'standard',
            variant,
            gguf,
            ctx,
            power,
            ssdStreaming,
            metalHotlistSeed,
            dspark,
          }),
        }, 15000);
        if (started?.adjusted) {
          if (Number.isFinite(Number(started.ctx)) && Number(started.ctx) > 0) {
            saved.ctxSize = Math.round(Number(started.ctx));
          }
          if (typeof started.dspark === 'boolean') saved.dspark = started.dspark;
          localStorage.setItem('ds4web.settings.v2', JSON.stringify(saved));
          showProgress(visualPct, 'Using a memory-safe engine configuration', started.warning || 'Saved settings adjusted');
        }
        return true;
      } catch (e) {
        showProgress(visualPct, 'Could not start the engine', 'Opening DStudio diagnostics');
        await sleep(500);
        location.replace('/');
        return false;
      }
    }

    async function waitForReady() {
      let failures = 0;
      let idlePolls = 0;
      for (;;) {
        try {
          const st = await fetchJson('/api/status', {}, 3500);
          if (st.ready === true && st.running === true) {
            showProgress(100, 'Ready', 'Opening DStudio');
            return true;
          }
          if (st.download && st.downloadPct >= 0) {
            idlePolls = 0;
            showProgress(st.downloadPct, `Downloading ${st.downloadVariant || 'model'}…`, st.engineLine || 'This may take a while');
          } else if (!st.running && st.engineError) {
            idlePolls++;
            showProgress(st.loadPct, st.stage || 'Engine needs attention', st.engineError);
            if (idlePolls >= 3) {
              await sleep(350);
              location.replace('/');
              return false;
            }
          } else if (st.running || st.stage) {
            idlePolls = 0;
            showProgress(st.loadPct, st.stage || 'Starting the local engine…', st.engineLine || st.engineError || '');
          } else {
            idlePolls++;
            showProgress(st.loadPct, st.engineError ? 'Engine needs attention' : 'Preparing DStudio…', st.engineError || 'Opening the workspace');
            if (idlePolls >= 3) {
              await sleep(350);
              location.replace('/');
              return false;
            }
          }
        } catch (e) {
          failures++;
          showProgress(visualPct, 'Connecting to DStudio…', failures > 2 ? 'The local launcher is taking longer than expected' : '');
          if (failures > 8) {
            location.replace('/');
            return false;
          }
        }
        await sleep(900);
      }
    }

    (async () => {
      if (await startWithSavedSettings() && await waitForReady()) {
        await sleep(220);
        location.replace('/');
      }
    })();
  </script>
</body>
</html>
